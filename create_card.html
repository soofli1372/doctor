<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت کارت جدید</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen pb-24">

    <!-- هدر -->
    <header class="bg-white shadow-sm p-4 flex items-center gap-4 sticky top-0 z-10">
        <a href="dashboard.html" class="text-2xl text-gray-600">➡️</a>
        <h1 class="font-bold text-gray-800 text-lg">ساخت کارت آموزشی</h1>
    </header>

    <main class="p-6 flex flex-col items-center">

        <!-- فرم ساخت کارت -->
        <div class="bg-white shadow-xl rounded-3xl p-8 w-full max-w-lg border border-blue-100">
            <div class="text-center mb-6">
                <div class="bg-blue-100 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">✍️</div>
                <h2 class="text-xl font-bold text-gray-800">اطلاعات کارت</h2>
                <p class="text-gray-500 text-sm">سوال و پاسخ را با دقت وارد کنید</p>
            </div>

            <form class="space-y-6">
                <!-- انتخاب بسته -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">انتخاب بسته (دسته بندی)</label>
                    <select class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all appearance-none bg-white">
                        <option>داخلی - قلب</option>
                        <option>جراحی - تروما</option>
                        <option>پزشکی قانونی</option>
                        <option>+ ساخت بسته جدید</option>
                    </select>
                </div>

                <!-- بخش سوال -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">سوال (روی کارت)</label>
                    <textarea rows="3" placeholder="سوال خود را اینجا بنویسید..." 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"></textarea>
                </div>

                <!-- بخش جواب -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">پاسخ (پشت کارت)</label>
                    <textarea rows="3" placeholder="پاسخ صحیح را اینجا بنویسید..." 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"></textarea>
                </div>

                <!-- آپلود تصویر برای کارت (اختیاری) -->
                <div class="bg-gray-50 p-4 rounded-2xl border-2 border-dashed border-gray-200">
                    <label class="block text-sm text-gray-600 mb-2 text-center font-medium">افزودن تصویر به کارت (اختیاری)</label>
                    <div class="flex flex-col items-center justify-center">
                        <input type="file" id="card-img" class="hidden" accept="image/">
                        <label for="card-img" class="cursor-pointer bg-white px-4 py-2 rounded-lg shadow-sm border border-gray-300 text-gray-600 hover:bg-gray-100 transition-all text-sm">
                            انتخاب تصویر
                        </label>
                    </div>
                </div>

                <!-- دکمه ذخیره -->
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95">
                    ذخیره کارت در بسته 💾
                </button>
            </form>
        </div>
    </main>

    <!-- منوی پایین -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center shadow-lg z-20">
        <a href="dashboard.html" class="flex flex-col items-center text-blue-600">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">خانه</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400">
            <span class="text-xl">🛒</span>
            <span class="text-[10px] font-bold">بازارچه</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400">
            <span class="text-xl">👥</span>
            <span class="text-[10px] font-bold">تبادل علمی</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400">
            <span class="text-xl">👤</span>
            <span class="text-[10px] font-bold">پروفایل</span>
        </a>
    </nav>

</body>
</html>
