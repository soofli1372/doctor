<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پلتفرم تخصصی پزشکان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white shadow-2xl rounded-3xl p-8 w-full max-w-md border border-blue-100">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white text-2xl font-bold">⚕️</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">خوش آمدید دکتر</h1>
            <p class="text-gray-500 text-sm mt-2">لطفاً برای دسترسی به فضای علمی وارد شوید</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">شماره موبایل یا ایمیل</label>
                <input type="text" id="login-identifier" required placeholder="مثلاً ۰۹۱۲..." 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">رمز عبور</label>
                <input type="password" id="login-password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform active:scale-95">
                ورود به حساب
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-gray-600 text-sm">حساب کاربری ندارید؟ <a href="signup.html" class="text-blue-600 font-bold hover:underline">ثبت‌نام کنید</a></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bvtabwwofmxzuknrliqd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9ru-fHj17h_ET7KduHLGIg_gmDsOAYR';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('login-form');

        loginForm.onsubmit = async function(e) {
            e.preventDefault();

            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                // جستجو در دیتابیس برای پیدا کردن کاربر بر اساس ایمیل یا موبایل و پسورد
                const { data, error } = await supabase
                    .from('profiles')
                    .select('')
                    .or(`email.eq.${identifier},phone.eq.${identifier}`)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    alert("ایمیل/موبایل یا رمز عبور اشتباه است! ❌");
                } else {
                    // ذخیره کاربر در Session برای استفاده در داشبورد
                    localStorage.setItem('currentUser', JSON.stringify(data));
                    alert("خوش آمدید دکتر " + data.name + "! ❤️");
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                alert("خطایی در اتصال به سرور رخ داد! ⚠️");
            }
        };
    </script>
</body>
</html>
