<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پلتفرم تخصصی پزشکان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white shadow-2xl rounded-3xl p-8 w-full max-w-md border border-blue-100">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white text-2xl font-bold">⚕️</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">خوش آمدید دکتر</h1>
            <p class="text-gray-500 text-sm mt-2">لطفاً برای دسترسی به فضای علمی وارد شوید</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-2">شماره موبایل یا ایمیل</label>
                <input type="text" id="login-identifier" required placeholder="مثلاً ۰۹۱۲..." 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr">
            </div>
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-2">رمز عبور</label>
                <input type="password" id="login-password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform active:scale-95">
                ورود به حساب
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-gray-600 text-sm">حساب کاربری ندارید؟ <a href="signup.html" class="text-blue-600 font-bold hover:underline">ثبت‌نام کنید</a></p>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');

        loginForm.onsubmit = async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();

            btn.innerText = "در حال بررسی...";
            btn.disabled = true;

            const SUPABASE_URL = 'https://bvtabwwofmxzuknrliqd.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_9ru-fHj17h_ET7KduHLGIg_gmDsOAYR';

            try {
                // جستجوی کاربر در دیتابیس (بر اساس ایمیل یا موبایل)
                // ما از فیلتر or استفاده می‌کنیم تا هر دو مورد را چک کند
                const response = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=*&or=(eq.email.${identifier},eq.phone.${identifier})`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                const users = await response.json();

                if (!users || users.length === 0) {
                    alert("کاربری با این مشخصات یافت نشد! ❌");
                } else {
                    const user = users[0];
                    // بررسی صحت رمز عبور
                    if (user.password === password) {
                        localStorage.setItem('currentUser', JSON.stringify(user));
                        alert("خوش آمدید دکتر " + user.name + "! ❤️");
                        window.location.href = "dashboard.html";
                    } else {
                        alert("رمز عبور اشتباه است! ❌");
                    }
                }
            } catch (err) {
                console.error("Error:", err);
                alert("خطای اتصال به سرور! ⚠️");
            } finally {
                btn.innerText = "ورود به حساب";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
