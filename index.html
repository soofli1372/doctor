<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پلتفرم تخصصی پزشکان</title>
    <!-- استفاده از Tailwind CSS برای طراحی مدرن و ریسپانسیو -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">

    <!-- کارت اصلی صفحه ورود -->
    <div class="bg-white shadow-2xl rounded-3xl p-8 w-full max-w-md border border-blue-100">
        
        <!-- لوگو و عنوان -->
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white text-2xl font-bold">⚕️</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">خوش آمدید دکتر</h1>
            <p class="text-gray-500 text-sm mt-2">لطفاً برای دسترسی به فضای علمی وارد شوید</p>
        </div>

        <!-- فرم ورود -->
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">شماره موبایل یا ایمیل</label>
                <input type="text" id="login-email" placeholder="مثلاً ۰۹۱۲..." 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all text-left" 
                    dir="ltr">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">رمز عبور</label>
                <input type="password" id="login-password" placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all text-left" 
                    dir="ltr">
            </div>

            <!-- دکمه ورود -->
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-colors duration-300 transform active:scale-95">
                ورود به حساب
            </button>
        </form>

        <!-- بخش ثبت‌نام -->
        <div class="mt-8 text-center">
            <p class="text-gray-600 text-sm">
                حساب کاربری ندارید؟ 
                <a href="signup.html" class="text-blue-600 font-bold hover:underline">ثبت‌نام کنید</a>
            </p>
        </div>
    </div>



    <script>
        const loginForm = document.getElementById('login-form');

        loginForm.onsubmit = function(e) {
            e.preventDefault(); // جلوگیری از رفرش شدن صفحه

            // دریافت مقادیر با استفاده از IDهای مشخص
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();

            // بررسی پر بودن فیلدها
            if (!email || !password) {
                alert("لطفاً ایمیل و رمز عبور را وارد کنید! 😊");
                return;
            }

            // خواندن لیست کاربران از LocalStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // پیدا کردن کاربری که ایمیل و پسوردش درست باشد
            // (اگر کاربر با موبایل ثبت‌نام کرده باشد، اینجا هم باید همان موبایل را بزند)
            const user = users.find(u => (u.email === email || u.phone === email) && u.password === password);

            if(user) {
                // ذخیره کاربر فعلی که وارد شده (Session)
                localStorage.setItem('currentUser', JSON.stringify(user));
                alert("خوش آمدید دکتر " + user.name + "! ❤️");
                window.location.href = "dashboard.html"; // انتقال به داشبورد
            } else {
                alert("ایمیل/موبایل یا رمز عبور اشتباه است! ❌");
            }
        };
    </script>


</body>
</html>
