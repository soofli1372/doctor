<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام پزشکان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white shadow-2xl rounded-3xl p-8 w-full max-w-2xl border border-blue-100 my-10">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white text-2xl font-bold">⚕️</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">عضویت در پلتفرم</h1>
            <p class="text-gray-500 text-sm mt-2">اطلاعات خود را برای دسترسی به پنل وارد کنید</p>
        </div>

        <form id="signup-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- نام و نام خانوادگی -->
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-1">نام</label>
                <input type="text" id="first_name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-right">
            </div>
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-1">نام خانوادگی</label>
                <input type="text" id="last_name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-right">
            </div>

            <!-- نام نمایشی و تخصص -->
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-1">نام نمایشی (نام کاربری)</label>
                <input type="text" id="display_name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-right" placeholder="مثلاً دکتر_رضایی">
            </div>
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-1">تخصص</label>
                <input type="text" id="specialty" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-right">
            </div>

            <!-- کد ملی و شماره نظام پزشکی -->
            <div class="text-left" dir="ltr">
                <label class="block text-sm font-medium text-gray-700 mb-1 text-right">کد ملی</label>
                <input type="text" id="national_code" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left">
            </div>
            <div class="text-left" dir="ltr">
                <label class="block text-sm font-medium text-gray-700 mb-1 text-right">شماره نظام پزشکی</label>
                <input type="text" id="medical_license_id" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left">
            </div>

            <!-- موبایل و رمز عبور -->
            <div class="text-left" dir="ltr">
                <label class="block text-sm font-medium text-gray-700 mb-1 text-right">شماره موبایل</label>
                <input type="text" id="phone" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left">
            </div>
            <div class="text-left" dir="ltr">
                <label class="block text-sm font-medium text-gray-700 mb-1 text-right">رمز عبور</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left">
            </div>

            <!-- آپلود عکس -->
            <div class="md:col-span-2 text-right">
                <label class="block text-sm font-medium text-gray-700 mb-1">تصویر کارت نظام پزشکی</label>
                <input type="file" id="license_image" accept="image/" required class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-gray-50 outline-none">
            </div>

            <button type="submit" id="submit-btn" class="md:col-span-2 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform active:scale-95">
                تکمیل ثبت‌نام و ارسال مدارک
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">قبلاً حساب ساخته‌اید؟ <a href="index.html" class="text-blue-600 font-bold hover:underline">وارد شوید</a></p>
        </div>
    </div>

    <script>
        const signupForm = document.getElementById('signup-form');

        signupForm.onsubmit = async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            btn.innerText = "در حال ثبت‌نام و آپلود...";
            btn.disabled = true;

            const SUPABASE_URL = 'https://bvtabwwofmxzuknrliqd.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_9ru-fHj17h_ET7KduHLGIg_gmDsOAYR';

            try {
                // 1. آپلود عکس به Storage
                const fileInput = document.getElementById('license_image');
                const file = fileInput.files[0];
                let imageUrl = "";

                if (file) {
                    const fileName = `${Date.now()}_${file.name}`;
                    const formDataImage = new FormData();
                    formDataImage.append('file', file);

                    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/doctor_documents/${fileName}`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                        body: formDataImage
                    });

                    if (!uploadRes.ok) throw new Error("خطا در آپلود عکس. لطفاً Bucket را در سوپابیس بسازید.");
                    imageUrl = `${SUPABASE_URL}/storage/v1/object/public/doctor_documents/${fileName}`;
                }

                // 2. جمع‌آوری اطلاعات
                const userData = {
                    first_name: document.getElementById('first_name').value,
                    last_name: document.getElementById('last_name').value,
                    display_name: document.getElementById('display_name').value,
                    specialty: document.getElementById('specialty').value,
                    national_code: document.getElementById('national_code').value,
                    medical_license_id: document.getElementById('medical_license_id').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value,
                    license_image_url: imageUrl,
                    name: `${document.getElementById('first_name').value} ${document.getElementById('last_name').value}`
                };

                // 3. ارسال به دیتابیس
                const response = await fetch(`${SUPABASE_URL}/rest/v1/profiles`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(userData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    if (errorData.code === '23505' || errorData.message.includes('duplicate')) {
                        throw new Error("این شماره موبایل یا کد ملی قبلاً ثبت شده است.");
                    } else {
                        throw new Error(errorData.message || 'خطایی در ثبت‌نام رخ داد');
                    }
                }

                alert("ثبت‌نام با موفقیت انجام شد. پس از تایید ادمین، می‌توانید وارد شوید. ❤️");
                window.location.href = "index.html";

            } catch (err) {
                alert("⚠️ " + err.message);
            } finally {
                btn.innerText = "تکمیل ثبت‌نام و ارسال مدارک";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
