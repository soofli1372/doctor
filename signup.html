<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام پزشکان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- لود کتابخانه سوپابیس از یک منبع جایگزین و مطمئن -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase-js@2.39.0/dist/npm/@supabase-js.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white shadow-2xl rounded-3xl p-8 w-full max-w-md border border-blue-100">
        <div class="text-center mb-8">
            <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-white text-2xl font-bold">⚕️</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">عضویت در پلتفرم</h1>
            <p class="text-gray-500 text-sm mt-2">اطلاعات خود را برای دسترسی به پنل وارد کنید</p>
        </div>

        <form id="signup-form" class="space-y-4">
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-1">نام و نام خانوادگی</label>
                <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-right">
            </div>
            <div class="text-right">
                <label class="block text-sm font-medium text-gray-700 mb-1">تخصص</label>
                <input type="text" id="specialty" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-right">
            </div>
            <div class="text-left" dir="ltr">
                <label class="block text-sm font-medium text-gray-700 mb-1 text-right">ایمیل</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left">
            </div>
            <div class="text-left" dir="ltr">
                <label class="block text-sm font-medium text-gray-700 mb-1 text-right">شماره موبایل</label>
                <input type="text" id="phone" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left">
            </div>
            <div class="text-left" dir="ltr">
                <label class="block text-sm font-medium text-gray-700 mb-1 text-right">رمز عبور</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-left">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform active:scale-95">
                تکمیل ثبت‌نام
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-600 text-sm">قبلاً حساب ساخته‌اید؟ <a href="index.html" class="text-blue-600 font-bold hover:underline">وارد شوید</a></p>
        </div>
    </div>

    <script>
        // استفاده از یک بلاک Try-Catch برای کل فرآیند مقداردهی اولیه
        let supabaseClient;
        try {
            const SUPABASE_URL = 'https://bvtabwwofmxzuknrliqd.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_9ru-fHj17h_ET7KduHLGIg_gmDsOAYR';
            
            // مقداردهی کلاینت با استفاده از متغیر جهانی supabase که توسط اسکریپت لود شده است
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            console.log("اتصال به سوپابیس برقرار شد");
        } catch (e) {
            console.error("خطا در لود سوپابیس:", e);
            alert("خطا در لود کتابخانه دیتابیس. لطفاً صفحه را رفرش کنید.");
        }

        const signupForm = document.getElementById('signup-form');

        signupForm.onsubmit = async function(e) {
            e.preventDefault(); // جلوگیری از ریست شدن صفحه
            
            const btn = document.getElementById('submit-btn');
            btn.innerText = "در حال ثبت‌نام...";
            btn.disabled = true;

            const formData = {
                name: document.getElementById('name').value,
                specialty: document.getElementById('specialty').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };

            try {
                if (!supabaseClient) {
                    throw new Error("کلاینت دیتابیس آماده نیست.");
                }

                const { data, error } = await supabaseClient
                    .from('profiles')
                    .insert([formData]);

                if (error) {
                    throw error; // انتقال به بخش catch
                }

                alert("ثبت‌نام با موفقیت انجام شد دکتر عزیز! ❤️");
                window.location.href = "index.html";
            } catch (err) {
                console.error("SupaBase Error:", err);
                alert("⚠️ خطا: " + err.message);
            } finally {
                btn.innerText = "تکمیل ثبت‌نام";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
