
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-es", charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطالعه فلش‌کارت‌ها</title>
    <!-- بارگذاری Tailwind از منبع معتبر -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');

        body { 
            font-family: 'Vazirmatn', sans-serif; 
            margin: 0; 
            padding: 0;
        }

        /* / استایل‌های دقیق برای جلوگیری از به هم ریختگی کارت / */
        .flip-card {
            background-color: transparent;
            width: 100%;
            max-width: 400px;
            height: 300px;
            perspective: 1000px;
            margin: 0 auto;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .flipped {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- هدر - با استفاده از flex برای جلوگیری از چسبیدن -->
    <header class="bg-white shadow-sm p-4 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="text-2xl text-gray-600 hover:text-blue-600 transition-colors">➡️</a>
            <h1 class="font-bold text-gray-800 text-lg">دسته: داخلی - قلب</h1>
        </div>
        <div class="text-sm text-gray-500 font-medium">کارت ۴ از ۱۲۰</div>
    </header>

    <!-- محتوا - با استفاده از flex-grow برای فضای خالی -->
    <main class="flex-grow flex flex-col items-center justify-center p-6">

        <!-- بخش کارت -->
        <div class="flip-card" onclick="flipCard()">
            <div id="cardInner" class="flip-card-inner">
                <!-- روی کارت (سوال) -->
                <div class="flip-card-front bg-white border-4 border-blue-500">
                    <span class="text-blue-500 text-sm mb-2 font-bold">سوال</span>
                    <p class="text-xl font-bold text-gray-800 text-center leading-relaxed">علائم اصلی نارسایی قلبی راست چیست؟</p>
                    <p class="absolute bottom-6 text-xs text-gray-400 italic">برای دیدن جواب کلیک کنید 👇</p>
                </div>
                <!-- پشت کارت (جواب) -->
                <div class="flip-card-back bg-blue-600 text-white">
                    <span class="text-blue-200 text-sm mb-2 font-bold">پاسخ</span>
                    <p class="text-lg text-center leading-relaxed">پف در پاها، تورم کبد (Hepatomegaly) و رگ‌های گردنی برجسته (JVD)</p>
                </div>
            </div>
        </div>

        <!-- دکمه‌های کنترل - با فاصله مناسب -->
        <div class="flex gap-4 mt-12">
            <button class="bg-white text-red-500 border-2 border-red-200 px-8 py-3 rounded-2xl font-bold shadow-sm hover:bg-red-50 transition-all active:scale-95">غلط ❌</button>
            <button class="bg-white text-green-600 border-2 border-green-200 px-8 py-3 rounded-2xl font-bold shadow-sm hover:bg-green-50 transition-all active:scale-95">درست ✅</button>
        </div>

    </main>

    <!-- منوی پایین - ثابت و مرتب -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-3 flex justify-between items-center shadow-lg z-20">
        <a href="dashboard.html" class="flex flex-col items-center text-blue-600">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">خانه</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-blue-600">
            <span class="text-xl">🛒</span>
            <span class="text-[10px] font-bold">بازارچه</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-blue-600">
            <span class="text-xl">👥</span>
            <span class="text-[10px] font-bold">تبادل علمی</span>
        </a>
        <a href="#" class="flex flex-col items-center text-gray-400 hover:text-blue-600">
            <span class="text-xl">👤</span>
            <span class="text-[10px] font-bold">پروفایل</span>
        </a>
    </nav>

    <script>
        function flipCard() {
            const card = document.getElementById('cardInner');
            card.classList.toggle('flipped');
        }
    </script>

</body>
</html>
