                    <p id="doc-specialty" class="text-blue-600 text-sm mb-6">...</p>

                    <div class="grid grid-cols-3 gap-4 max-w-md mx-auto mb-6 border-y py-4 border-gray-100">
                        <div class="text-center">
                            <span id="like-count" class="block font-bold text-gray-800 text-lg">۰</span>

                        </div>
                        <div class="text-center border-x px-6 border-gray-100">
                            <span id="follower-count" class="block font-bold text-gray-800 text-lg">۰</span>

                        </div>

                        </div>

                </div>

        </div>

        <!-- بخش تعاملات (Tab 2) -->
        <div id="tab-interactions" class="tab-content hidden space-y-6">
            <!-- فرم طرح سوال -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-blue-100">
                <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">❓ طرح سوال تخصصی</h3>
                <div class="space-y-4">
                    <input type="text" id="q-title" placeholder="عنوان سوال..." class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-400">
                    <textarea id="q-content" placeholder="جزئیات سوال را بنویسید..." class="w-full p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-400 h-32"></textarea>
                    <div class="flex flex-wrap gap-4 items-center">
                        <select id="q-specialty" class="p-3 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-blue-400">
                            <option value="">انتخاب تخصص مقصد...</option>
                        </select>
                        <input type="file" id="q-image" class="text-xs text-gray-500">
                        <button id="submit-q-btn" class="mr-auto bg-blue-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-blue-700 transition-all">ارسال سوال</button>
                    </div>
                </div>
            </div>

            <!-- فیلترها -->
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button onclick="loadQuestions('all')" class="q-filter-btn active-tab px-4 py-2 rounded-full bg-white border text-sm transition-all">جدیدترین‌ها</button>
                <button onclick="loadQuestions('mine')" class="q-filter-btn px-4 py-2 rounded-full bg-white border text-sm transition-all">سوالات من</button>
                <button onclick="loadQuestions('referred')" class="q-filter-btn px-4 py-2 rounded-full bg-white border text-sm transition-all">ارجاع شده به من</button>
            </div>

            <!-- لیست سوالات -->
            <div id="questions-container" class="space-y-4"></div>
        </div>
    </main>

        const SUPABASE_URL = 'https://bvtabwwofmxzuknrliqd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9ru-fHj17h_ET7KduHLGIg_gmDsOAYR';
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));

        window.onload = async function() {

        async function initProfile() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${currentUser.id}&select=*`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();
            const user = data[0];
            if (user) {
                document.getElementById('doc-full-name').innerText = `${user.first_name} ${user.last_name}`;
                document.getElementById('doc-specialty').innerText = user.specialty;
                if (user.avatar_url) document.getElementById('profile-img').src = user.avatar_url;
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById('tab-profile-btn').classList.remove('active-tab');
            document.getElementById('tab-interactions-btn').classList.remove('active-tab');
            document.getElementById(`tab-${tab}-btn`).classList.add('active-tab');
        }

        document.getElementById('avatar-input').onchange = async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fileName = `avatars/${currentUser.id}_${Date.now()}`;
            const formData = new FormData();
            formData.append('file', file);
            const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/profiles/${fileName}`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                body: formData
            });
            if (uploadRes.ok) {
                const url = `${SUPABASE_URL}/storage/v1/object/public/profiles/${fileName}`;
                await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${currentUser.id}`, {
                    method: 'PATCH',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ avatar_url: url })
                });
                document.getElementById('profile-img').src = url;
                alert("عکس پروفایل به‌روز شد ✅");

async function loadQuestions(filter) {
    // ابتدا نمایش لودینگ ساده
    const container = document.getElementById('questions-container');
    container.innerHTML = '<div class="text-center py-10 text-gray-400">در حال دریافت سوالات...</div>';

    let query = `questions?select=,profiles(first_name,last_name,specialty)&order=created_at.desc`;

    if (filter === 'mine') query += `&doctor_id=eq.${currentUser.id}`;
    if (filter === 'referred') query += `&target_doctor_id=eq.${currentUser.id}`;

    try {
        const res = await fetch(`${SUPABASE_URL}/${query}`, {
            headers: { 
                'apikey': SUPABASE_KEY, 
                'Authorization': `Bearer ${SUPABASE_KEY}` 
            }
        });

        const data = await res.json();

        if (!Array.isArray(data)) {
            throw new Error("پاسخ دریافتی از سرور آرایه نیست");
        }

        if (data.length === 0) {
            container.innerHTML = '<div class="text-center py-10 text-gray-500">هیچ سوالی یافت نشد. 😕</div>';
            return;
        }

        container.innerHTML = ''; // پاک کردن لودینگ

        data.forEach(q => {
            // مدیریت داده‌های پروفایل برای جلوگیری از خطای undefined
            const doc = q.profiles || { first_name: 'کاربر', last_name: 'ناشناس', specialty: 'نامشخص' };

            container.innerHTML += `
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-3 transition-all hover:shadow-md">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center text-xs font-bold text-blue-600">
                                ${doc.first_name ? doc.first_name[0] : '؟'}
                            </div>
                            <span class="text-sm font-bold text-gray-700">${doc.first_name} ${doc.last_name}</span>
                        </div>
                        <span class="text-[10px] bg-blue-50 text-blue-500 px-2 py-1 rounded-full">${q.target_specialty || 'عمومی'}</span>
                    </div>
                    <h4 class="font-bold text-gray-800">${q.title}</h4>
                    <p class="text-sm text-gray-600">${q.content}</p>
                    ${q.image_url ? `<img src="${q.image_url}" class="w-full h-48 object-cover rounded-2xl mt-2">` : ''}
                    <div class="flex justify-end gap-3 pt-3 border-t border-gray-50">
                        <button class="text-xs text-blue-600 font-bold hover:underline">پاسخ دادن ✍️</button>
                    </div>
                </div>
            `;
        });
    } catch (error) {
        console.error("Error loading questions:", error);
        container.innerHTML = '<div class="text-center py-10 text-red-400">خطا در دریافت اطلاعات. لطفاً صفحه را رفرش کنید.</div>';
    }
}

        document.getElementById('submit-q-btn').onclick = async function() {
            const title = document.getElementById('q-title').value;
            const content = document.getElementById('q-content').value;
            const specialty = document.getElementById('q-specialty').value;
            const file = document.getElementById('q-image').files[0];

            if (!title || !content) return alert("لطفاً عنوان و متن را وارد کنید.");

            let imageUrl = "";
            if (file) {
                const fileName = `questions/${Date.now()}_${file.name}`;
                const formData = new FormData();
                formData.append('file', file);
                await fetch(`${SUPABASE_URL}/storage/v1/object/questions/${fileName}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: formData
                });
                imageUrl = `${SUPABASE_URL}/storage/v1/object/public/questions/${fileName}`;
            }

            const response = await fetch(`${SUPABASE_URL}/rest/v1/questions`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    doctor_id: currentUser.id,
                    title: title,
                    content: content,
                    target_specialty: specialty,
                    image_url: imageUrl,
                    question_type: 'general'
                })
            });

            if (response.ok) {
                alert("سوال شما با موفقیت ارسال شد ✅");
                loadQuestions('all');
            } else {
                alert("خطایی در ارسال رخ داد ❌");
            }
        };

        document.getElementById('logout-btn').onclick = function() {
            localStorage.clear();
            window.location.href = 'index.html';
        };
    </script>
