<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کل | ادمین</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <nav class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-2xl">👑</span>
            <span class="font-bold text-lg">پنل مدیریت کل سیستم</span>
        </div>
        <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl text-sm transition-all">خروج از مدیریت</button>
    </nav>

    <main class="p-6 max-w-6xl mx-auto space-y-8">

        <!-- بخش مدیریت کاربران -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">مدیریت درخواست‌های عضویت</h2>
                <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-xs font-bold">لیست پزشکان</span>
            </div>
            <div class="p-6 overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead class="text-gray-500 text-sm border-b">
                        <tr>
                            <th class="pb-3 font-medium">نام و نام خانوادگی</th>
                            <th class="pb-3 font-medium">تخصص</th>
                            <th class="pb-3 font-medium">کد ملی</th>
                            <th class="pb-3 font-medium">نظام پزشکی</th>
                            <th class="pb-3 font-medium">موبایل</th>
                            <th class="pb-3 font-medium">مدارک</th>
                            <th class="pb-3 font-medium text-center">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="text-gray-700">
                        <!-- کاربران اینجا لود می‌شوند -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- بخش مدیریت تخصص‌ها -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6">مدیریت تخصص‌ها</h2>
            <div class="flex gap-3 mb-6">
                <input type="text" id="new-category" placeholder="برای مثال پزشک عمومی ..." class="flex-1 px-4 py-2 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-blue-400 text-right">
                <button id="add-category-btn" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-green-700 transition-all">افزودن تخصص</button>
            </div>
            <div id="categories-list" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <!-- تخصص‌ها به صورت لیست-وار اینجا لود می‌شوند -->
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://bvtabwwofmxzuknrliqd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9ru-fHj17h_ET7KduHLGIg_gmDsOAYR';
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));

        window.onload = async function() {
            if (!currentUser || currentUser.role !== 'admin') {
                alert("شما اجازه دسترسی به این صفحه را ندارید!");
                window.location.href = 'index.html';
                return;
            }
            loadUsers();
            loadCategories();
        };

        // لود کاربران با اطلاعات جدید
        async function loadUsers() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const users = await res.json();
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50 transition-all";
                tr.innerHTML = `
                    <td class="py-4">${user.first_name || user.last_name}</td>
                    <td class="py-4">${user.specialty}</td>
                    <td class="py-4 text-xs text-gray-500">${user.national_code}</td>
                    <td class="py-4 text-xs text-gray-500">${user.medical_license_id}</td>
                    <td class="py-4" dir="ltr">${user.phone}</td>
                    <td class="py-4">
                        ${user.license_image_url ? `<a href="${user.license_image_url}" target="_blank" class="text-blue-600 underline text-xs">مشاهده کارت</a>` : 'ارسال نشده'}
                    </td>
                    <td class="py-4 text-center">
                        <button onclick="deleteUser('${user.id}')" class="text-red-500 hover:text-red-700 font-bold text-xs px-3 py-1 border border-red-200 rounded-lg">حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteUser(id) {
            if (confirm("آیا از حذف این کاربر مطمئن هستید؟")) {
                await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                loadUsers();
            }
        }

        // مدیریت تخصص‌ها (با جلوگیری از تکرار و ذخیره در دیتابیس)
        async function loadCategories() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/specialties?select=name&order=name.asc`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const categories = await res.json();
            const list = document.getElementById('categories-list');
            list.innerHTML = '';

            categories.forEach(cat => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center p-3 bg-slate-50 border border-gray-200 rounded-xl text-gray-700";
                item.innerHTML = `
                    <span>${cat.name}</span>
                    <button onclick="deleteCategory('${cat.name}')" class="text-red-400 hover:text-red-600 text-xs">حذف</button>
                `;
                list.appendChild(item);
            });
        }

        document.getElementById('add-category-btn').onclick = async function() {
            const input = document.getElementById('new-category');
            const name = input.value.trim();
            if (!name) return;

            // 1. چک کردن تکراری نبودن تخصص
            const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/specialties?name=eq.${name}`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const existing = await checkRes.json();

            if (existing.length > 0) {
                alert("این تخصص قبلاً اضافه شده است و تکراری می‌باشد! ❌");
                return;
            }

            // 2. اضافه کردن به دیتابیس
            const res = await fetch(`${SUPABASE_URL}/rest/v1/specialties`, {
                method: 'POST',
                headers: { 
                    'apikey': SUPABASE_KEY, 
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ name: name })
            });

            if (res.ok) {
                input.value = '';
                loadCategories();
            } else {
                alert("خطایی در ذخیره تخصص رخ داد.");
            }
        };

        async function deleteCategory(name) {
            if (confirm(`آیا تخصص ${name} حذف شود؟`)) {
                await fetch(`${SUPABASE_URL}/rest/v1/specialties?name=eq.${name}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                loadCategories();
            }
        }

        document.getElementById('logout-btn').onclick = function() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
