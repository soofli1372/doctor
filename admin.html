<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کل | ادمین</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <nav class="bg-slate-800 text-white px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <span class="text-2xl">👑</span>
            <span class="font-bold text-lg">پنل مدیریت کل سیستم</span>
        </div>
        <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl text-sm transition-all">خروج از مدیریت</button>
    </nav>

    <main class="p-6 max-w-6xl mx-auto space-y-8">

        <!-- بخش مدیریت کاربران -->
        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">مدیریت درخواست‌های عضویت</h2>
                <span class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-xs font-bold">لیست پزشکان</span>
            </div>
            <div class="p-6 overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="text-gray-500 text-sm border-b">
                            <th class="pb-3 font-medium">نام پزشک</th>
                            <th class="pb-3 font-medium">تخصص</th>
                            <th class="pb-3 font-medium">ایمیل/تلفن</th>
                            <th class="pb-3 font-medium text-center">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="text-gray-700">
                        <!-- کاربران اینجا لود می‌شوند -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- بخش مدیریت دسته‌بندی‌ها / محله‌ها -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-200">
            <h2 class="text-xl font-bold text-gray-800 mb-6">مدیریت دسته‌بندی‌ها و محله‌ها</h2>
            <div class="flex gap-3 mb-6">
                <input type="text" id="new-category" placeholder="نام محله یا تخصص جدید..." class="flex-1 px-4 py-2 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-blue-400 text-right">
                <button id="add-category-btn" class="bg-green-600 text-white px-6 py-2 rounded-xl font-bold hover:bg-green-700 transition-all">افزودن</button>
            </div>
            <div id="categories-list" class="flex flex-wrap gap-2">
                <!-- دسته‌بندی‌ها اینجا لود می‌شوند -->
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://bvtabwwofmxzuknrliqd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9ru-fHj17h_ET7KduHLGIg_gmDsOAYR';
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));

        window.onload = async function() {
            if (!currentUser || currentUser.role !== 'admin') {
                alert("شما اجازه دسترسی به این صفحه را ندارید!");
                window.location.href = 'index.html';
                return;
            }
            loadUsers();
            loadCategories();
        };

        // لود کاربران و مدیریت آن‌ها
        async function loadUsers() {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const users = await res.json();
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = "border-b last:border-0 hover:bg-gray-50 transition-all";
                tr.innerHTML = `
                    <td class="py-4 font-medium">${user.name}</td>
                    <td class="py-4 text-sm text-gray-500">${user.specialty}</td>
                    <td class="py-4 text-xs text-gray-400" dir="ltr">${user.email || user.phone}</td>
                    <td class="py-4 text-center">
                        <button onclick="deleteUser('${user.id}')" class="text-red-500 hover:text-red-700 font-bold text-xs px-3 py-1 border border-red-200 rounded-lg">رد/حذف کاربر</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteUser(id) {
            if (confirm("آیا از حذف این کاربر مطمئن هستید؟")) {
                await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                loadUsers();
            }
        }

        // مدیریت دسته‌بندی‌ها (شبیه‌سازی شده با جدول جدید یا محلی)
        document.getElementById('add-category-btn').onclick = async function() {
            const name = document.getElementById('new-category').value;
            if (!name) return;

            // اینجا می‌توانید یک جدول مخصوص categories بسازید، فعلاً برای نمایش سریع:
            alert("دسته‌بندی " + name + " با موفقیت اضافه شد.");
            document.getElementById('new-job').value = '';
            loadCategories(); 
        };

        async function loadCategories() {
            // این بخش را می‌توانید به یک جدول واقعی در دیتابیس متصل کنید
            const list = document.getElementById('categories-list');
            list.innerHTML = `<span class="bg-gray-200 px-3 py-1 rounded-full text-sm text-gray-600">نمونه محله ۱</span>
                               <span class="bg-gray-200 px-3 py-1 rounded-full text-sm text-gray-600">نمونه محله ۲</span>`;
        }

        document.getElementById('logout-btn').onclick = function() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
